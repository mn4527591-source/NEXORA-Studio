<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA | لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f5f7ff;font-family:Tahoma,Arial,sans-serif;padding:20px}
.container{max-width:1050px;margin:45px auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-size:27px;font-weight:bold;color:#55dce9;direction:ltr}
.card{background:#141d32;border:1px solid #293650;border-radius:18px;padding:25px;margin-bottom:20px}
h1,h2{margin-top:0}
.muted{color:#aab5cc}
input{width:100%;padding:14px;margin:9px 0 17px;background:#0b1020;border:1px solid #394663;border-radius:10px;color:white;font-size:16px}
button{background:linear-gradient(100deg,#48d9e8,#8b7cff);border:0;border-radius:10px;padding:13px 22px;font-weight:bold;cursor:pointer;color:#07111f}
button:disabled{opacity:.5;cursor:not-allowed}
#logout{background:#293650;color:white}
#message{color:#ffb5b5;margin-top:12px}
#dashboard{display:none}
.stats{display:flex;gap:15px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:#0b1020;padding:18px;border-radius:12px}
.stat strong{display:block;font-size:28px;color:#55dce9;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:right;padding:13px;border-bottom:1px solid #293650;vertical-align:top}
th{color:#55dce9}
td{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:13px;color:#aab5cc}
@media(max-width:600px){body{padding:12px}.container{margin:20px auto}.card{padding:17px}header{align-items:flex-start;gap:10px;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="logo">NEXORA</div>
  <div class="muted">ADMIN DASHBOARD</div>
</header>

<section class="card" id="login">
  <h1>تسجيل دخول الإدارة</h1>
  <p class="muted">سجّل الدخول بحساب مسؤول NEXORA.</p>

  <form id="loginForm">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginButton" type="submit">تسجيل الدخول</button>
  </form>

  <p id="message" role="status"></p>
</section>

<section id="dashboard">
  <div class="card">
    <h1>لوحة الإدارة</h1>
    <p class="muted">مرحبًا بك في لوحة إدارة NEXORA.</p>
    <div class="actions">
      <button id="refresh">تحديث الطلبات</button>
      <button id="logout">تسجيل الخروج</button>
    </div>
    <p id="status" class="small"></p>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat">
        إجمالي الطلبات
        <strong id="total">0</strong>
      </div>
      <div class="stat">
        الطلبات الجديدة
        <strong id="newCount">0</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>طلبات العملاء</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>البريد الإلكتروني</th>
            <th>تفاصيل الطلب</th>
            <th>الحالة</th>
            <th>التاريخ</th>
          </tr>
        </thead>
        <tbody id="requestsBody">
          <tr><td colspan="5">لم يتم تحميل الطلبات بعد.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</div>

<script>
const SUPABASE_URL = "https://okbbpucduevbciiqwowo.supabase.co";
const SUPABASE_KEY = "sb_publishable_n8H5Qawv0xhdU9MwHn9lHA_dsR7L3SA";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const statusText = document.getElementById("status");

function showLogin(text = "") {
  loginSection.style.display = "block";
  dashboard.style.display = "none";
  message.textContent = text;
}

function showDashboard() {
  loginSection.style.display = "none";
  dashboard.style.display = "block";
  message.textContent = "";
}

async function verifyAdmin(user) {
  const { data, error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await db.auth.signOut();
    showLogin("هذا الحساب ليس لديه صلاحية الإدارة.");
    return false;
  }

  showDashboard();
  await loadRequests();
  return true;
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "جارٍ تسجيل الدخول...";
  message.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showLogin("تعذر تسجيل الدخول. راجع البريد وكلمة المرور.");
  } else {
    await verifyAdmin(data.user);
  }

  button.disabled = false;
  button.textContent = "تسجيل الدخول";
});

async function loadRequests() {
  statusText.textContent = "جارٍ تحميل الطلبات...";
  const body = document.getElementById("requestsBody");
  body.replaceChildren();

  let result = await db
    .from("client_requests")
    .select("*")
    .order("created_at", { ascending: false });

  // في حالة عدم وجود عمود created_at نجرب القراءة بدون ترتيب.
  if (result.error) {
    result = await db
      .from("client_requests")
      .select("*");
  }

  if (result.error) {
    statusText.textContent = "تعذر تحميل الطلبات. راجع صلاحيات الجدول.";
    console.error(result.error);
    return;
  }

  const requests = result.data || [];
  document.getElementById("total").textContent = requests.length;
  document.getElementById("newCount").textContent =
    requests.filter(r => String(r.status || "").toLowerCase() === "new").length;

  if (!requests.length) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 5;
    cell.textContent = "لا توجد طلبات حتى الآن.";
    row.appendChild(cell);
    body.appendChild(row);
  }

  requests.forEach(request => {
    const row = document.createElement("tr");

    const values = [
      request.client_name || "—",
      request.email || "—",
      request.details || "—",
      request.status || "—",
      request.created_at
        ? new Date(request.created_at).toLocaleString("ar-EG")
        : "—"
    ];

    values.forEach(value => {
      const cell = document.createElement("td");
      cell.textContent = String(value);
      row.appendChild(cell);
    });

    body.appendChild(row);
  });

  statusText.textContent = "تم تحميل الطلبات بنجاح.";
}

document.getElementById("refresh").addEventListener("click", loadRequests);

document.getElementById("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  showLogin("تم تسجيل الخروج.");
});

async function startApp() {
  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {
    showLogin();
    return;
  }

  await verifyAdmin(data.session.user);
}

startApp();
</script>
</body>
</html>
